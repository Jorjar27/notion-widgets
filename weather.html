<!DOCTYPE html>
<html lang="en-GB">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Onsen Weather</title>

    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;

            margin: 0;
            padding: 0;

            background: transparent;

            color: #f1efe8;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 8px;

            overflow: hidden;
        }


        /* =====================================================
           WEATHER CARD
           ===================================================== */

        .weather-card {
            position: relative;

            width: calc(100% - 4px);
            max-width: 360px;

            padding: 16px 18px;

            overflow: hidden;

            background:
                rgba(26, 35, 31, 0.58);

            border:
                1px solid
                rgba(190, 207, 184, 0.17);

            border-radius: 16px;

            box-shadow:
                0 8px 24px
                rgba(0, 0, 0, 0.10);

            backdrop-filter:
                blur(12px)
                saturate(105%);

            -webkit-backdrop-filter:
                blur(12px)
                saturate(105%);
        }

        .weather-card::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.035),
                    transparent 48%
                );
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .weather-header {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .weather-heading {
            min-width: 0;
        }

        .weather-label {
            margin: 0 0 4px;

            color:
                rgba(190, 207, 184, 0.88);

            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .weather-title {
            margin: 0;

            color: #f3f1e9;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 23px;
            font-weight: 400;
            line-height: 1.1;
        }

        .weather-location {
            margin: 4px 0 0;

            color:
                rgba(218, 223, 214, 0.56);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 11px;
            font-style: italic;
        }


        /* =====================================================
           MOON
           ===================================================== */

        .weather-moon {
            position: relative;

            width: 16px;
            height: 16px;

            flex: 0 0 auto;

            margin-top: 3px;

            background:
                rgba(217, 224, 205, 0.88);

            border-radius: 50%;
        }

        .weather-moon::after {
            content: "";

            position: absolute;
            top: -3px;
            left: 6px;

            width: 16px;
            height: 16px;

            background:
                rgba(28, 37, 33, 0.98);

            border-radius: 50%;
        }


        /* =====================================================
           LOADING AND ERROR MESSAGE
           ===================================================== */

        .weather-status {
            position: relative;
            z-index: 1;

            padding: 28px 10px;

            color:
                rgba(218, 223, 214, 0.60);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 12px;
            font-style: italic;
            line-height: 1.4;
            text-align: center;
        }

        .weather-status.error {
            color:
                rgba(210, 221, 202, 0.90);
        }

        [hidden] {
            display: none !important;
        }


        /* =====================================================
           CURRENT WEATHER
           ===================================================== */

        .weather-current {
            position: relative;
            z-index: 1;

            display: grid;

            grid-template-columns:
                65px
                minmax(0, 1fr);

            align-items: center;
            gap: 13px;

            padding: 11px 12px;

            background:
                rgba(255, 255, 255, 0.025);

            border:
                1px solid
                rgba(225, 233, 222, 0.10);

            border-radius: 11px;
        }

        .weather-icon {
            display: grid;
            place-items: center;

            width: 65px;
            height: 65px;

            color:
                rgba(210, 221, 202, 0.92);

            background:
                rgba(255, 255, 255, 0.018);

            border:
                1px solid
                rgba(210, 221, 202, 0.10);

            border-radius: 50%;

            font-size: 34px;
            line-height: 1;
        }

        .weather-temperature-row {
            display: flex;
            align-items: flex-start;
        }

        .weather-temperature {
            margin: 0;

            color: #f3f1e9;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 46px;
            font-weight: 400;
            line-height: 0.9;
        }

        .weather-unit {
            margin: 1px 0 0 2px;

            color:
                rgba(190, 207, 184, 0.88);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;
        }

        .weather-description {
            margin: 7px 0 0;

            color:
                rgba(218, 223, 214, 0.68);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 12px;
            font-style: italic;
            line-height: 1.2;
        }

        .weather-feels-like {
            margin: 4px 0 0;

            color:
                rgba(190, 207, 184, 0.78);

            font-size: 7px;
            font-weight: 700;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }


        /* =====================================================
           WEATHER DETAILS
           ===================================================== */

        .weather-details {
            position: relative;
            z-index: 1;

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap: 5px;

            margin-top: 6px;
        }

        .weather-detail {
            min-width: 0;

            padding: 8px 4px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.018);

            border:
                1px solid
                rgba(225, 233, 222, 0.09);

            border-radius: 8px;
        }

        .weather-detail-label {
            display: block;

            margin-bottom: 4px;

            color:
                rgba(218, 223, 214, 0.48);

            font-size: 6px;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .weather-detail-value {
            display: block;

            overflow: hidden;

            color:
                rgba(241, 239, 232, 0.88);

            font-size: 10px;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }


        /* =====================================================
           SMALL NOTION COLUMNS
           ===================================================== */

        @media (max-width: 330px) {

            body {
                padding: 5px;
            }

            .weather-card {
                padding: 14px 13px;
            }

            .weather-current {
                grid-template-columns:
                    52px
                    minmax(0, 1fr);

                gap: 10px;

                padding: 9px;
            }

            .weather-icon {
                width: 52px;
                height: 52px;

                font-size: 29px;
            }

            .weather-temperature {
                font-size: 40px;
            }

            .weather-detail-value {
                font-size: 9px;
            }

        }

    </style>

</head>


<body>

    <main
        class="weather-card"
        aria-label="Current weather"
    >

        <header class="weather-header">

            <div class="weather-heading">

                <p class="weather-label">
                    Weather forecast
                </p>

                <h1 class="weather-title">
                    Today
                </h1>

                <p
                    class="weather-location"
                    id="weatherLocation"
                >
                    Gosport, Hampshire
                </p>

            </div>

            <span
                class="weather-moon"
                aria-hidden="true"
            ></span>

        </header>


        <div
            class="weather-status"
            id="weatherStatus"
        >
            Gathering the evening mist…
        </div>


        <div
            id="weatherContent"
            hidden
        >

            <section class="weather-current">

                <div
                    class="weather-icon"
                    id="weatherIcon"
                    aria-hidden="true"
                >
                    ☁
                </div>


                <div>

                    <div class="weather-temperature-row">

                        <p
                            class="weather-temperature"
                            id="weatherTemperature"
                        >
                            --
                        </p>

                        <span class="weather-unit">
                            °C
                        </span>

                    </div>


                    <p
                        class="weather-description"
                        id="weatherDescription"
                    >
                        Loading weather…
                    </p>


                    <p
                        class="weather-feels-like"
                        id="weatherFeelsLike"
                    >
                        Feels like --°C
                    </p>

                </div>

            </section>


            <section
                class="weather-details"
                aria-label="Weather details"
            >

                <div class="weather-detail">

                    <span class="weather-detail-label">
                        High / low
                    </span>

                    <span
                        class="weather-detail-value"
                        id="weatherHighLow"
                    >
                        --° / --°
                    </span>

                </div>


                <div class="weather-detail">

                    <span class="weather-detail-label">
                        Rain
                    </span>

                    <span
                        class="weather-detail-value"
                        id="weatherRain"
                    >
                        --%
                    </span>

                </div>


                <div class="weather-detail">

                    <span class="weather-detail-label">
                        Wind
                    </span>

                    <span
                        class="weather-detail-value"
                        id="weatherWind"
                    >
                        -- km/h
                    </span>

                </div>

            </section>

        </div>

    </main>


    <script>

        "use strict";


        const weatherLocation = {
            name: "Gosport, Hampshire",
            latitude: 50.7949,
            longitude: -1.1291
        };


        function getWeatherInformation(
            code,
            isDay
        ) {

            const weatherCodes = {

                0: [
                    "Clear skies",
                    isDay ? "☀" : "☾"
                ],

                1: [
                    "Mainly clear",
                    isDay ? "☀" : "☾"
                ],

                2: [
                    "Partly cloudy",
                    isDay ? "⛅" : "☾"
                ],

                3: [
                    "Overcast",
                    "☁"
                ],

                45: [
                    "Misty",
                    "≋"
                ],

                48: [
                    "Freezing fog",
                    "≋"
                ],

                51: [
                    "Light drizzle",
                    "☂"
                ],

                53: [
                    "Drizzle",
                    "☂"
                ],

                55: [
                    "Heavy drizzle",
                    "☂"
                ],

                56: [
                    "Freezing drizzle",
                    "❄"
                ],

                57: [
                    "Heavy freezing drizzle",
                    "❄"
                ],

                61: [
                    "Light rain",
                    "☂"
                ],

                63: [
                    "Rain",
                    "☂"
                ],

                65: [
                    "Heavy rain",
                    "☔"
                ],

                66: [
                    "Freezing rain",
                    "❄"
                ],

                67: [
                    "Heavy freezing rain",
                    "❄"
                ],

                71: [
                    "Light snow",
                    "❄"
                ],

                73: [
                    "Snow",
                    "❄"
                ],

                75: [
                    "Heavy snow",
                    "❄"
                ],

                77: [
                    "Snow grains",
                    "❄"
                ],

                80: [
                    "Light rain showers",
                    "☂"
                ],

                81: [
                    "Rain showers",
                    "☂"
                ],

                82: [
                    "Heavy rain showers",
                    "☔"
                ],

                85: [
                    "Light snow showers",
                    "❄"
                ],

                86: [
                    "Heavy snow showers",
                    "❄"
                ],

                95: [
                    "Thunderstorms",
                    "ϟ"
                ],

                96: [
                    "Thunderstorms and hail",
                    "ϟ"
                ],

                99: [
                    "Severe thunderstorms",
                    "ϟ"
                ]

            };


            const information =
                weatherCodes[code] || [
                    "Changing skies",
                    "☁"
                ];


            return {
                description: information[0],
                icon: information[1]
            };

        }


        function roundNumber(value) {

            if (
                value === null ||
                value === undefined ||
                Number.isNaN(Number(value))
            ) {
                return "--";
            }


            return Math.round(
                Number(value)
            );

        }


        function displayWeather(
            weatherData
        ) {

            const current =
                weatherData.current;


            const daily =
                weatherData.daily;


            const weather =
                getWeatherInformation(
                    current.weather_code,
                    current.is_day === 1
                );


            document.getElementById(
                "weatherIcon"
            ).textContent =
                weather.icon;


            document.getElementById(
                "weatherTemperature"
            ).textContent =
                roundNumber(
                    current.temperature_2m
                );


            document.getElementById(
                "weatherDescription"
            ).textContent =
                weather.description;


            document.getElementById(
                "weatherFeelsLike"
            ).textContent =
                "Feels like " +
                roundNumber(
                    current.apparent_temperature
                ) +
                "°C";


            document.getElementById(
                "weatherHighLow"
            ).textContent =
                roundNumber(
                    daily.temperature_2m_max[0]
                ) +
                "° / " +
                roundNumber(
                    daily.temperature_2m_min[0]
                ) +
                "°";


            document.getElementById(
                "weatherRain"
            ).textContent =
                roundNumber(
                    daily.precipitation_probability_max[0]
                ) +
                "%";


            document.getElementById(
                "weatherWind"
            ).textContent =
                roundNumber(
                    current.wind_speed_10m
                ) +
                " km/h";

        }


        async function loadWeather() {

            const statusElement =
                document.getElementById(
                    "weatherStatus"
                );


            const contentElement =
                document.getElementById(
                    "weatherContent"
                );


            statusElement.hidden = false;

            statusElement.classList.remove(
                "error"
            );


            statusElement.textContent =
                "Gathering the evening mist…";


            contentElement.hidden = true;


            document.getElementById(
                "weatherLocation"
            ).textContent =
                weatherLocation.name;


            const apiAddress =
                "https://api.open-meteo.com/v1/forecast" +

                "?latitude=" +
                weatherLocation.latitude +

                "&longitude=" +
                weatherLocation.longitude +

                "&current=" +
                "temperature_2m," +
                "apparent_temperature," +
                "weather_code," +
                "is_day," +
                "wind_speed_10m" +

                "&daily=" +
                "temperature_2m_max," +
                "temperature_2m_min," +
                "precipitation_probability_max" +

                "&temperature_unit=celsius" +

                "&wind_speed_unit=kmh" +

                "&timezone=Europe%2FLondon" +

                "&forecast_days=1";


            try {

                const response =
                    await fetch(
                        apiAddress
                    );


                if (!response.ok) {

                    throw new Error(
                        "Weather request failed with status " +
                        response.status
                    );

                }


                const weatherData =
                    await response.json();


                if (
                    !weatherData.current ||
                    !weatherData.daily
                ) {

                    throw new Error(
                        "The weather response was incomplete."
                    );

                }


                displayWeather(
                    weatherData
                );


                statusElement.hidden = true;
                contentElement.hidden = false;

            } catch (error) {

                console.error(
                    "Weather widget error:",
                    error
                );


                statusElement.classList.add(
                    "error"
                );


                statusElement.textContent =
                    "The weather could not be loaded. Please refresh the widget.";

            }

        }


        loadWeather();


        window.setInterval(
            loadWeather,
            30 * 60 * 1000
        );

    </script>

</body>

</html>
