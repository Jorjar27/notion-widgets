<!DOCTYPE html>
<html lang="en-GB">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Onsen Weather</title>

    <style>

        /* =====================================================
           PAGE RESET
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: auto;
            min-height: 0;

            margin: 0;
            padding: 0;

            background: transparent;
        }

        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;

            color: #efeee8;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            overflow: hidden;
        }


        /* =====================================================
           WEATHER CARD
           ===================================================== */

        .weather-card {
            position: relative;

            width: 100%;
            max-width: 360px;

            margin: 0;
            padding: 13px 14px 12px;

            overflow: hidden;

            background:
                rgba(27, 31, 29, 0.55);

            border:
                1px solid
                rgba(175, 183, 165, 0.16);

            border-radius: 15px;

            box-shadow:
                0 7px 20px
                rgba(0, 0, 0, 0.09);

            backdrop-filter:
                blur(11px)
                saturate(95%);

            -webkit-backdrop-filter:
                blur(11px)
                saturate(95%);
        }

        .weather-card::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.028),
                    transparent 46%
                );
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .weather-header {
            position: relative;
            z-index: 1;

            margin-bottom: 9px;
        }

        .weather-label {
            margin: 0 0 3px;

            color:
                rgba(174, 182, 160, 0.82);

            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .weather-heading-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
        }

        .weather-title {
            margin: 0;

            color: #f1efe9;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 22px;
            font-weight: 400;
            line-height: 1.1;
        }

        .weather-location {
            margin: 0;

            color:
                rgba(205, 208, 198, 0.48);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 10px;
            font-style: italic;
            line-height: 1.2;

            text-align: right;
        }


        /* =====================================================
           LOADING AND ERROR
           ===================================================== */

        .weather-status {
            position: relative;
            z-index: 1;

            margin: 0;
            padding: 24px 8px;

            color:
                rgba(205, 208, 198, 0.58);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 11px;
            font-style: italic;
            line-height: 1.4;
            text-align: center;
        }

        .weather-status.error {
            color:
                rgba(210, 211, 194, 0.82);
        }

        [hidden] {
            display: none !important;
        }


        /* =====================================================
           CURRENT WEATHER
           ===================================================== */

        .weather-current {
            position: relative;
            z-index: 1;

            display: grid;

            grid-template-columns:
                54px
                minmax(0, 1fr);

            align-items: center;
            gap: 10px;

            padding: 9px 10px;

            background:
                rgba(255, 255, 255, 0.018);

            border:
                1px solid
                rgba(175, 183, 165, 0.11);

            border-radius: 10px;
        }

        .weather-icon {
            display: grid;
            place-items: center;

            width: 54px;
            height: 54px;

            color:
                rgba(210, 211, 194, 0.84);

            background:
                rgba(255, 255, 255, 0.014);

            border:
                1px solid
                rgba(175, 183, 165, 0.11);

            border-radius: 50%;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 29px;
            line-height: 1;
        }

        .weather-main {
            min-width: 0;
        }

        .weather-temperature-row {
            display: flex;
            align-items: flex-start;

            margin: 0;
        }

        .weather-temperature {
            margin: 0;

            color: #f1efe9;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 41px;
            font-weight: 400;
            line-height: 0.9;
        }

        .weather-unit {
            margin: 1px 0 0 2px;

            color:
                rgba(174, 182, 160, 0.82);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 16px;
        }

        .weather-description {
            margin: 6px 0 0;

            color:
                rgba(205, 208, 198, 0.66);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 11px;
            font-style: italic;
            line-height: 1.2;
        }

        .weather-feels-like {
            margin: 3px 0 0;

            color:
                rgba(174, 182, 160, 0.72);

            font-size: 7px;
            font-weight: 700;
            letter-spacing: 0.09em;
            line-height: 1.2;
            text-transform: uppercase;
        }


        /* =====================================================
           WEATHER DETAILS
           ===================================================== */

        .weather-details {
            position: relative;
            z-index: 1;

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap: 5px;

            margin-top: 5px;
        }

        .weather-detail {
            min-width: 0;

            padding: 7px 3px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.014);

            border:
                1px solid
                rgba(175, 183, 165, 0.09);

            border-radius: 8px;
        }

        .weather-detail-label {
            display: block;

            margin-bottom: 3px;

            color:
                rgba(205, 208, 198, 0.43);

            font-size: 6px;
            font-weight: 700;
            letter-spacing: 0.07em;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .weather-detail-value {
            display: block;

            overflow: hidden;

            color:
                rgba(239, 238, 232, 0.82);

            font-size: 9px;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }


        /* =====================================================
           SMALL NOTION COLUMNS
           ===================================================== */

        @media (max-width: 330px) {

            .weather-card {
                padding: 11px 12px 10px;
            }

            .weather-title {
                font-size: 20px;
            }

            .weather-location {
                font-size: 9px;
            }

            .weather-current {
                grid-template-columns:
                    48px
                    minmax(0, 1fr);

                gap: 8px;

                padding: 8px;
            }

            .weather-icon {
                width: 48px;
                height: 48px;

                font-size: 26px;
            }

            .weather-temperature {
                font-size: 37px;
            }

            .weather-detail-value {
                font-size: 8px;
            }

        }

    </style>

</head>


<body>

    <main
        class="weather-card"
        aria-label="Current weather in Gosport"
    >

        <header class="weather-header">

            <p class="weather-label">
                Weather
            </p>

            <div class="weather-heading-row">

                <h1 class="weather-title">
                    Today
                </h1>

                <p
                    class="weather-location"
                    id="weatherLocation"
                >
                    Gosport, Hampshire
                </p>

            </div>

        </header>


        <p
            class="weather-status"
            id="weatherStatus"
        >
            Gathering the mist…
        </p>


        <div
            id="weatherContent"
            hidden
        >

            <section class="weather-current">

                <div
                    class="weather-icon"
                    id="weatherIcon"
                    aria-hidden="true"
                >
                    ☁
                </div>


                <div class="weather-main">

                    <div class="weather-temperature-row">

                        <p
                            class="weather-temperature"
                            id="weatherTemperature"
                        >
                            --
                        </p>

                        <span class="weather-unit">
                            °C
                        </span>

                    </div>


                    <p
                        class="weather-description"
                        id="weatherDescription"
                    >
                        Loading weather…
                    </p>


                    <p
                        class="weather-feels-like"
                        id="weatherFeelsLike"
                    >
                        Feels like --°C
                    </p>

                </div>

            </section>


            <section
                class="weather-details"
                aria-label="Weather details"
            >

                <div class="weather-detail">

                    <span class="weather-detail-label">
                        High / low
                    </span>

                    <span
                        class="weather-detail-value"
                        id="weatherHighLow"
                    >
                        --° / --°
                    </span>

                </div>


                <div class="weather-detail">

                    <span class="weather-detail-label">
                        Rain
                    </span>

                    <span
                        class="weather-detail-value"
                        id="weatherRain"
                    >
                        --%
                    </span>

                </div>


                <div class="weather-detail">

                    <span class="weather-detail-label">
                        Wind
                    </span>

                    <span
                        class="weather-detail-value"
                        id="weatherWind"
                    >
                        -- km/h
                    </span>

                </div>

            </section>

        </div>

    </main>


    <script>

        "use strict";


        const weatherLocation = {
            name: "Gosport, Hampshire",
            latitude: 50.7949,
            longitude: -1.1291
        };


        function getWeatherInformation(
            code,
            isDay
        ) {

            const weatherCodes = {

                0: [
                    "Clear skies",
                    isDay ? "☀" : "☾"
                ],

                1: [
                    "Mainly clear",
                    isDay ? "☀" : "☾"
                ],

                2: [
                    "Partly cloudy",
                    "☁"
                ],

                3: [
                    "Overcast",
                    "☁"
                ],

                45: [
                    "Misty",
                    "≋"
                ],

                48: [
                    "Freezing fog",
                    "≋"
                ],

                51: [
                    "Light drizzle",
                    "☂"
                ],

                53: [
                    "Drizzle",
                    "☂"
                ],

                55: [
                    "Heavy drizzle",
                    "☂"
                ],

                56: [
                    "Freezing drizzle",
                    "❄"
                ],

                57: [
                    "Heavy freezing drizzle",
                    "❄"
                ],

                61: [
                    "Light rain",
                    "☂"
                ],

                63: [
                    "Rain",
                    "☂"
                ],

                65: [
                    "Heavy rain",
                    "☂"
                ],

                66: [
                    "Freezing rain",
                    "❄"
                ],

                67: [
                    "Heavy freezing rain",
                    "❄"
                ],

                71: [
                    "Light snow",
                    "❄"
                ],

                73: [
                    "Snow",
                    "❄"
                ],

                75: [
                    "Heavy snow",
                    "❄"
                ],

                77: [
                    "Snow grains",
                    "❄"
                ],

                80: [
                    "Light rain showers",
                    "☂"
                ],

                81: [
                    "Rain showers",
                    "☂"
                ],

                82: [
                    "Heavy rain showers",
                    "☂"
                ],

                85: [
                    "Light snow showers",
                    "❄"
                ],

                86: [
                    "Heavy snow showers",
                    "❄"
                ],

                95: [
                    "Thunderstorms",
                    "ϟ"
                ],

                96: [
                    "Thunderstorms and hail",
                    "ϟ"
                ],

                99: [
                    "Severe thunderstorms",
                    "ϟ"
                ]

            };


            const information =
                weatherCodes[code] || [
                    "Changing skies",
                    "☁"
                ];


            return {
                description: information[0],
                icon: information[1]
            };

        }


        function roundWeatherValue(value) {

            const number =
                Number(value);


            if (!Number.isFinite(number)) {
                return "--";
            }


            return Math.round(number);

        }


        function displayWeather(weatherData) {

            const current =
                weatherData.current;


            const daily =
                weatherData.daily;


            const weather =
                getWeatherInformation(
                    current.weather_code,
                    current.is_day === 1
                );


            document.getElementById(
                "weatherIcon"
            ).textContent =
                weather.icon;


            document.getElementById(
                "weatherTemperature"
            ).textContent =
                roundWeatherValue(
                    current.temperature_2m
                );


            document.getElementById(
                "weatherDescription"
            ).textContent =
                weather.description;


            document.getElementById(
                "weatherFeelsLike"
            ).textContent =
                "Feels like " +
                roundWeatherValue(
                    current.apparent_temperature
                ) +
                "°C";


            document.getElementById(
                "weatherHighLow"
            ).textContent =
                roundWeatherValue(
                    daily.temperature_2m_max[0]
                ) +
                "° / " +
                roundWeatherValue(
                    daily.temperature_2m_min[0]
                ) +
                "°";


            document.getElementById(
                "weatherRain"
            ).textContent =
                roundWeatherValue(
                    daily.precipitation_probability_max[0]
                ) +
                "%";


            document.getElementById(
                "weatherWind"
            ).textContent =
                roundWeatherValue(
                    current.wind_speed_10m
                ) +
                " km/h";

        }


        async function loadWeather() {

            const statusElement =
                document.getElementById(
                    "weatherStatus"
                );


            const contentElement =
                document.getElementById(
                    "weatherContent"
                );


            statusElement.hidden = false;

            statusElement.classList.remove(
                "error"
            );


            statusElement.textContent =
                "Gathering the mist…";


            contentElement.hidden = true;


            document.getElementById(
                "weatherLocation"
            ).textContent =
                weatherLocation.name;


            const apiAddress =
                new URL(
                    "https://api.open-meteo.com/v1/forecast"
                );


            apiAddress.searchParams.set(
                "latitude",
                weatherLocation.latitude
            );


            apiAddress.searchParams.set(
                "longitude",
                weatherLocation.longitude
            );


            apiAddress.searchParams.set(
                "current",
                [
                    "temperature_2m",
                    "apparent_temperature",
                    "weather_code",
                    "is_day",
                    "wind_speed_10m"
                ].join(",")
            );


            apiAddress.searchParams.set(
                "daily",
                [
                    "temperature_2m_max",
                    "temperature_2m_min",
                    "precipitation_probability_max"
                ].join(",")
            );


            apiAddress.searchParams.set(
                "temperature_unit",
                "celsius"
            );


            apiAddress.searchParams.set(
                "wind_speed_unit",
                "kmh"
            );


            apiAddress.searchParams.set(
                "timezone",
                "Europe/London"
            );


            apiAddress.searchParams.set(
                "forecast_days",
                "1"
            );


            try {

                const response =
                    await fetch(
                        apiAddress,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Weather request returned " +
                        response.status
                    );

                }


                const weatherData =
                    await response.json();


                if (
                    !weatherData.current ||
                    !weatherData.daily
                ) {

                    throw new Error(
                        "Weather response was incomplete."
                    );

                }


                displayWeather(
                    weatherData
                );


                statusElement.hidden = true;
                contentElement.hidden = false;

            } catch (error) {

                console.error(
                    "Weather widget error:",
                    error
                );


                statusElement.classList.add(
                    "error"
                );


                statusElement.textContent =
                    "The weather could not be loaded. Please refresh.";

            }

        }


        loadWeather();


        window.setInterval(
            loadWeather,
            30 * 60 * 1000
        );

    </script>

</body>

</html>
