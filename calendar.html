<!DOCTYPE html>
<html lang="en-GB">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Onsen Calendar</title>

    <style>

        /* =====================================================
           PAGE RESET TEST
           ===================================================== */

        :root {
            color-scheme: dark;
        }
        
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: auto;

            margin: 0;
            padding: 0;

            background: transparent;
        }

        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;

            width: 100%;
            height: auto;
            min-height: 0;

            margin: 0;
            padding: 6px;

            background: #191919 !important;

            color: #efeee8;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            overflow: hidden;
        }


        /* =====================================================
           CALENDAR CARD
           ===================================================== */

        .calendar-card {
            position: relative;

            width: calc(100% - 2px);
            max-width: 360px;

            margin: 0;
            padding: 15px 17px 11px;

            overflow: hidden;

            background:
                rgba(27, 31, 29, 0.55);

            border:
                1px solid
                rgba(175, 183, 165, 0.16);

            border-radius: 15px;

            box-shadow:
                0 7px 20px
                rgba(0, 0, 0, 0.09);

            backdrop-filter:
                blur(11px)
                saturate(95%);

            -webkit-backdrop-filter:
                blur(11px)
                saturate(95%);
        }

        .calendar-card::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.028),
                    transparent 46%
                );
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .calendar-header {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            margin-bottom: 10px;
        }

        .calendar-heading {
            min-width: 0;
        }

        .calendar-label {
            margin: 0 0 3px;

            color:
                rgba(174, 182, 160, 0.82);

            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .calendar-month {
            margin: 0;

            color: #f1efe9;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 22px;
            font-weight: 400;
            line-height: 1.1;
        }

        .calendar-year {
            color:
                rgba(205, 208, 198, 0.48);

            font-size: 0.68em;
            font-weight: 400;
        }


        /* =====================================================
           CRESCENT MOON
           ===================================================== */

        .calendar-moon {
            position: relative;

            width: 15px;
            height: 15px;

            flex: 0 0 auto;

            margin-top: 2px;

            background:
                rgba(210, 211, 194, 0.82);

            border-radius: 50%;
        }

        .calendar-moon::after {
            content: "";

            position: absolute;
            top: -3px;
            left: 6px;

            width: 15px;
            height: 15px;

            background:
                rgba(29, 33, 31, 0.98);

            border-radius: 50%;
        }


        /* =====================================================
           WEEKDAY HEADERS
           ===================================================== */

        .calendar-weekdays {
            position: relative;
            z-index: 1;

            display: grid;

            grid-template-columns:
                repeat(
                    7,
                    minmax(0, 1fr)
                );

            gap: 3px;

            margin-bottom: 3px;
        }

        .calendar-weekday {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 0;
            padding: 2px 0;

            color:
                rgba(204, 207, 198, 0.45);

            font-size: 7px;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }


        /* =====================================================
           CALENDAR GRID
           ===================================================== */

        .calendar-grid {
            position: relative;
            z-index: 1;

            display: grid;

            grid-template-columns:
                repeat(
                    7,
                    minmax(0, 1fr)
                );

            gap: 3px;
        }

        .calendar-day {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 0;
            min-height: 29px;

            padding: 2px;

            color:
                rgba(239, 238, 232, 0.82);

            background: transparent;

            border:
                1px solid
                transparent;

            border-radius: 7px;

            font-size: 10px;
            line-height: 1;
            text-align: center;
        }

        .calendar-day:not(
            .calendar-empty
        ):hover {
            background:
                rgba(255, 255, 255, 0.045);
        }

        .calendar-empty {
            color: transparent;

            pointer-events: none;
        }

        .calendar-today {
            color: #f3f1eb;

            background:
                rgba(143, 153, 133, 0.17);

            border-color:
                rgba(174, 182, 160, 0.24);

            font-weight: 700;
        }


        /* =====================================================
           SMALL NOTION COLUMNS
           ===================================================== */

        @media (max-width: 330px) {

            body {
                padding: 4px;
            }

            .calendar-card {
                padding:
                    13px
                    12px
                    9px;
            }

            .calendar-month {
                font-size: 20px;
            }

            .calendar-day {
                min-height: 26px;

                font-size: 9px;
            }

        }

    </style>

</head>


<body>

    <main
        class="calendar-card"
        aria-label="Current month calendar"
    >

        <header class="calendar-header">

            <div class="calendar-heading">

                <p class="calendar-label">
                    Monthly calendar
                </p>

                <h1
                    class="calendar-month"
                    id="calendarMonth"
                >
                    Loading…
                </h1>

            </div>

            <span
                class="calendar-moon"
                aria-hidden="true"
            ></span>

        </header>


        <div
            class="calendar-weekdays"
            aria-hidden="true"
        >

            <span class="calendar-weekday">
                Mon
            </span>

            <span class="calendar-weekday">
                Tue
            </span>

            <span class="calendar-weekday">
                Wed
            </span>

            <span class="calendar-weekday">
                Thu
            </span>

            <span class="calendar-weekday">
                Fri
            </span>

            <span class="calendar-weekday">
                Sat
            </span>

            <span class="calendar-weekday">
                Sun
            </span>

        </div>


        <section
            class="calendar-grid"
            id="calendarGrid"
            aria-label="Days of the month"
        ></section>

    </main>


    <script>

        "use strict";


        function getMondayFirstPosition(
            year,
            month
        ) {

            const sundayFirstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            return (
                sundayFirstDay + 6
            ) % 7;

        }


        function createCalendarDay(
            dayNumber,
            isToday
        ) {

            const dayElement =
                document.createElement(
                    "div"
                );


            dayElement.className =
                "calendar-day";


            dayElement.textContent =
                dayNumber;


            if (isToday) {

                dayElement.classList.add(
                    "calendar-today"
                );


                dayElement.setAttribute(
                    "aria-current",
                    "date"
                );

            }


            return dayElement;

        }


        function createEmptyDay() {

            const emptyDay =
                document.createElement(
                    "div"
                );


            emptyDay.className =
                "calendar-day calendar-empty";


            emptyDay.setAttribute(
                "aria-hidden",
                "true"
            );


            return emptyDay;

        }


        function renderCalendar() {

            const now =
                new Date();


            const year =
                now.getFullYear();


            const month =
                now.getMonth();


            const currentDay =
                now.getDate();


            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            const firstDayPosition =
                getMondayFirstPosition(
                    year,
                    month
                );


            const monthName =
                now.toLocaleDateString(
                    "en-GB",
                    {
                        month: "long"
                    }
                );


            document.getElementById(
                "calendarMonth"
            ).innerHTML =
                monthName +
                ' <span class="calendar-year">' +
                year +
                "</span>";


            const calendarGrid =
                document.getElementById(
                    "calendarGrid"
                );


            calendarGrid.replaceChildren();


            for (
                let index = 0;
                index < firstDayPosition;
                index++
            ) {

                calendarGrid.appendChild(
                    createEmptyDay()
                );

            }


            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                calendarGrid.appendChild(
                    createCalendarDay(
                        day,
                        day === currentDay
                    )
                );

            }


            const totalCells =
                firstDayPosition +
                daysInMonth;


            const trailingCells =
                (
                    7 -
                    (
                        totalCells % 7
                    )
                ) % 7;


            for (
                let index = 0;
                index < trailingCells;
                index++
            ) {

                calendarGrid.appendChild(
                    createEmptyDay()
                );

            }

        }


        renderCalendar();


        window.setInterval(
            renderCalendar,
            60 * 60 * 1000
        );

    </script>

</body>

</html>
