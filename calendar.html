<!DOCTYPE html>
<html lang="en-GB">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Onsen Calendar</title>

    <style>

        /* =====================================================
           PAGE RESET
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;

            margin: 0;
            padding: 0;

            background: transparent;

            color: #f1efe8;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 8px;

            overflow: hidden;
        }


        /* =====================================================
           CALENDAR CARD
           ===================================================== */

        .calendar-card {
            position: relative;

            width: calc(100% - 4px);
            max-width: 360px;

            padding: 16px 18px 15px;

            overflow: hidden;

            background:
                rgba(26, 35, 31, 0.58);

            border:
                1px solid
                rgba(190, 207, 184, 0.17);

            border-radius: 16px;

            box-shadow:
                0 8px 24px
                rgba(0, 0, 0, 0.10);

            backdrop-filter:
                blur(12px)
                saturate(105%);

            -webkit-backdrop-filter:
                blur(12px)
                saturate(105%);
        }

        .calendar-card::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.035),
                    transparent 48%
                );
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .calendar-header {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            margin-bottom: 13px;
        }

        .calendar-heading {
            min-width: 0;
        }

        .calendar-label {
            margin: 0 0 4px;

            color:
                rgba(190, 207, 184, 0.88);

            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .calendar-month {
            margin: 0;

            color: #f3f1e9;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 23px;
            font-weight: 400;
            line-height: 1.1;
        }

        .calendar-year {
            color:
                rgba(218, 223, 214, 0.52);

            font-size: 0.68em;
            font-weight: 400;
        }


        /* =====================================================
           CRESCENT MOON
           ===================================================== */

        .calendar-moon {
            position: relative;

            width: 16px;
            height: 16px;

            flex: 0 0 auto;

            margin-top: 3px;

            background:
                rgba(217, 224, 205, 0.88);

            border-radius: 50%;
        }

        .calendar-moon::after {
            content: "";

            position: absolute;
            top: -3px;
            left: 6px;

            width: 16px;
            height: 16px;

            background:
                rgba(28, 37, 33, 0.98);

            border-radius: 50%;
        }


        /* =====================================================
           WEEKDAY HEADERS
           ===================================================== */

        .calendar-weekdays {
            position: relative;
            z-index: 1;

            display: grid;

            grid-template-columns:
                repeat(
                    7,
                    minmax(0, 1fr)
                );

            gap: 3px;

            margin-bottom: 4px;
        }

        .calendar-weekday {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 0;
            padding: 3px 0;

            color:
                rgba(218, 223, 214, 0.48);

            font-size: 7px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }


        /* =====================================================
           DATE GRID
           ===================================================== */

        .calendar-grid {
            position: relative;
            z-index: 1;

            display: grid;

            grid-template-columns:
                repeat(
                    7,
                    minmax(0, 1fr)
                );

            gap: 3px;
        }

        .calendar-day {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 0;
            min-height: 31px;

            padding: 3px;

            color:
                rgba(241, 239, 232, 0.84);

            background: transparent;

            border:
                1px solid
                transparent;

            border-radius: 8px;

            font-size: 10px;
            line-height: 1;
            text-align: center;
        }

        .calendar-day:not(
            .calendar-empty
        ):hover {
            background:
                rgba(255, 255, 255, 0.05);
        }

        .calendar-empty {
            color: transparent;

            pointer-events: none;
        }

        .calendar-today {
            color: #f5f3ec;

            background:
                rgba(151, 174, 148, 0.18);

            border-color:
                rgba(190, 207, 184, 0.27);

            font-weight: 700;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .calendar-footer {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 12px;
        }

        .calendar-footer::before,
        .calendar-footer::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    rgba(190, 207, 184, 0.17)
                );
        }

        .calendar-footer::after {
            background:
                linear-gradient(
                    to left,
                    transparent,
                    rgba(190, 207, 184, 0.17)
                );
        }

        .calendar-footer-symbol {
            color:
                rgba(151, 174, 148, 0.72);

            font-size: 10px;
            line-height: 1;
        }


        /* =====================================================
           SMALL NOTION COLUMNS
           ===================================================== */

        @media (max-width: 330px) {

            body {
                padding: 5px;
            }

            .calendar-card {
                padding:
                    14px
                    13px
                    13px;
            }

            .calendar-day {
                min-height: 27px;

                font-size: 9px;
            }

            .calendar-month {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>

    <main
        class="calendar-card"
        aria-label="Current month calendar"
    >

        <header class="calendar-header">

            <div class="calendar-heading">

                <p class="calendar-label">
                    Monthly calendar
                </p>

                <h1
                    class="calendar-month"
                    id="calendarMonth"
                >
                    Loading…
                </h1>

            </div>

            <span
                class="calendar-moon"
                aria-hidden="true"
            ></span>

        </header>


        <div
            class="calendar-weekdays"
            aria-hidden="true"
        >

            <span class="calendar-weekday">
                Mon
            </span>

            <span class="calendar-weekday">
                Tue
            </span>

            <span class="calendar-weekday">
                Wed
            </span>

            <span class="calendar-weekday">
                Thu
            </span>

            <span class="calendar-weekday">
                Fri
            </span>

            <span class="calendar-weekday">
                Sat
            </span>

            <span class="calendar-weekday">
                Sun
            </span>

        </div>


        <section
            class="calendar-grid"
            id="calendarGrid"
            aria-label="Days of the month"
        ></section>


        <div
            class="calendar-footer"
            aria-hidden="true"
        >

            <span class="calendar-footer-symbol">
                ♨
            </span>

        </div>

    </main>


    <script>

        "use strict";


        function getMondayFirstPosition(
            year,
            month
        ) {

            const sundayFirstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            return (
                sundayFirstDay + 6
            ) % 7;

        }


        function createCalendarDay(
            dayNumber,
            isToday
        ) {

            const dayElement =
                document.createElement("div");


            dayElement.className =
                "calendar-day";


            dayElement.textContent =
                dayNumber;


            if (isToday) {

                dayElement.classList.add(
                    "calendar-today"
                );


                dayElement.setAttribute(
                    "aria-current",
                    "date"
                );

            }


            return dayElement;

        }


        function createEmptyDay() {

            const emptyDay =
                document.createElement("div");


            emptyDay.className =
                "calendar-day calendar-empty";


            emptyDay.setAttribute(
                "aria-hidden",
                "true"
            );


            return emptyDay;

        }


        function renderCalendar() {

            const now =
                new Date();


            const year =
                now.getFullYear();


            const month =
                now.getMonth();


            const currentDay =
                now.getDate();


            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            const firstDayPosition =
                getMondayFirstPosition(
                    year,
                    month
                );


            const monthName =
                now.toLocaleDateString(
                    "en-GB",
                    {
                        month: "long"
                    }
                );


            document.getElementById(
                "calendarMonth"
            ).innerHTML =
                monthName +
                ' <span class="calendar-year">' +
                year +
                "</span>";


            const calendarGrid =
                document.getElementById(
                    "calendarGrid"
                );


            calendarGrid.replaceChildren();


            for (
                let index = 0;
                index < firstDayPosition;
                index++
            ) {

                calendarGrid.appendChild(
                    createEmptyDay()
                );

            }


            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                calendarGrid.appendChild(
                    createCalendarDay(
                        day,
                        day === currentDay
                    )
                );

            }


            const totalCells =
                firstDayPosition +
                daysInMonth;


            const trailingCells =
                (
                    7 -
                    (
                        totalCells % 7
                    )
                ) % 7;


            for (
                let index = 0;
                index < trailingCells;
                index++
            ) {

                calendarGrid.appendChild(
                    createEmptyDay()
                );

            }

        }


        renderCalendar();


        window.setInterval(
            renderCalendar,
            60 * 60 * 1000
        );

    </script>

</body>

</html>
