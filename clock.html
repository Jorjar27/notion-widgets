<!DOCTYPE html>
<html lang="en-GB">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Onsen Clock</title>

    <style>

        /* =====================================================
           PAGE RESET
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;

            background: transparent;

            color: #f0eee7;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 8px;

            overflow: hidden;
        }


        /* =====================================================
           CLOCK CARD
           ===================================================== */

        .clock-card {
            position: relative;

            width: calc(100% - 4px);
            max-width: 340px;

            padding: 17px 20px 15px;

            overflow: hidden;

            background:
                rgba(26, 35, 31, 0.58);

            border:
                1px solid
                rgba(190, 207, 184, 0.17);

            border-radius: 16px;

            box-shadow:
                0 8px 24px
                rgba(0, 0, 0, 0.10);

            backdrop-filter:
                blur(12px)
                saturate(105%);

            -webkit-backdrop-filter:
                blur(12px)
                saturate(105%);
        }


        .clock-card::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.035),
                    transparent 48%
                );
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .clock-header {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 9px;
        }


        .clock-greeting {
            margin: 0;

            color:
                rgba(190, 207, 184, 0.88);

            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }


        /* =====================================================
           CRESCENT MOON
           ===================================================== */

        .clock-moon {
            position: relative;

            width: 16px;
            height: 16px;

            flex: 0 0 auto;

            background:
                rgba(217, 224, 205, 0.88);

            border-radius: 50%;
        }


        .clock-moon::after {
            content: "";

            position: absolute;
            top: -3px;
            left: 6px;

            width: 16px;
            height: 16px;

            background:
                rgba(28, 37, 33, 0.98);

            border-radius: 50%;
        }


        /* =====================================================
           TIME
           ===================================================== */

        .clock-time {
            position: relative;
            z-index: 1;

            display: flex;
            justify-content: center;
            align-items: baseline;

            margin: 0;

            color: #f3f1e9;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    44px,
                    15vw,
                    62px
                );

            font-weight: 400;
            line-height: 0.95;
            letter-spacing: 0.02em;

            white-space: nowrap;
        }


        .clock-colon {
            margin: 0 3px;

            color:
                rgba(174, 194, 169, 0.90);

            animation:
                colon-pulse
                2s
                ease-in-out
                infinite;
        }


        /* =====================================================
           DATE
           ===================================================== */

        .clock-date {
            position: relative;
            z-index: 1;

            margin: 8px 0 0;

            color:
                rgba(219, 223, 215, 0.64);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 12px;
            font-style: italic;
            line-height: 1.35;
            text-align: center;
        }


        /* =====================================================
           MINIMAL BOTTOM DETAIL
           ===================================================== */

        .clock-detail {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 12px;
        }


        .clock-detail::before,
        .clock-detail::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    rgba(190, 207, 184, 0.17)
                );
        }


        .clock-detail::after {
            background:
                linear-gradient(
                    to left,
                    transparent,
                    rgba(190, 207, 184, 0.17)
                );
        }


        .clock-detail-symbol {
            color:
                rgba(151, 174, 148, 0.72);

            font-size: 10px;
            line-height: 1;
        }


        /* =====================================================
           ANIMATION
           ===================================================== */

        @keyframes colon-pulse {

            0%,
            100% {
                opacity: 0.42;
            }

            50% {
                opacity: 1;
            }

        }


        /* =====================================================
           SMALL NOTION COLUMNS
           ===================================================== */

        @media (max-width: 320px) {

            body {
                padding: 5px;
            }

            .clock-card {
                padding:
                    14px
                    15px
                    13px;
            }

            .clock-time {
                font-size:
                    clamp(
                        38px,
                        16vw,
                        50px
                    );
            }

            .clock-date {
                font-size: 11px;
            }

        }


        @media (prefers-reduced-motion: reduce) {

            .clock-colon {
                animation: none;
            }

        }

    </style>

</head>


<body>

    <main
        class="clock-card"
        aria-label="Current time and date"
    >

        <header class="clock-header">

            <p
                class="clock-greeting"
                id="clockGreeting"
            >
                Good evening
            </p>

            <span
                class="clock-moon"
                aria-hidden="true"
            ></span>

        </header>


        <time
            class="clock-time"
            id="clockTime"
        >

            <span id="clockHours">
                00
            </span>

            <span
                class="clock-colon"
                aria-hidden="true"
            >
                :
            </span>

            <span id="clockMinutes">
                00
            </span>

        </time>


        <p
            class="clock-date"
            id="clockDate"
        >
            Loading today’s date…
        </p>


        <div
            class="clock-detail"
            aria-hidden="true"
        >

            <span class="clock-detail-symbol">
                ♨
            </span>

        </div>

    </main>


    <script>

        "use strict";


        function padNumber(number) {

            return String(number).padStart(
                2,
                "0"
            );

        }


        function getGreeting(hour) {

            if (hour < 5) {
                return "Quiet night";
            }

            if (hour < 12) {
                return "Good morning";
            }

            if (hour < 17) {
                return "Good afternoon";
            }

            if (hour < 22) {
                return "Good evening";
            }

            return "Quiet night";

        }


        function updateClock() {

            const now =
                new Date();


            const hours =
                padNumber(
                    now.getHours()
                );


            const minutes =
                padNumber(
                    now.getMinutes()
                );


            document.getElementById(
                "clockHours"
            ).textContent = hours;


            document.getElementById(
                "clockMinutes"
            ).textContent = minutes;


            document.getElementById(
                "clockGreeting"
            ).textContent =
                getGreeting(
                    now.getHours()
                );


            document.getElementById(
                "clockDate"
            ).textContent =
                now.toLocaleDateString(
                    "en-GB",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long"
                    }
                );


            document.getElementById(
                "clockTime"
            ).setAttribute(
                "datetime",
                now.toISOString()
            );

        }


        updateClock();


        window.setInterval(
            updateClock,
            1000
        );

    </script>

</body>

</html>
