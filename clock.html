<!DOCTYPE html>
<html lang="en-GB">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Analogue Clock</title>

    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: auto;

            margin: 0;
            padding: 0;

            background: transparent;
        }

        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;

            overflow: hidden;
        }


        /* =====================================================
           CLOCK FACE
           ===================================================== */

        .clock-face {
            position: relative;

            width: 190px;
            height: 190px;

            margin: 0;

            overflow: hidden;

            background:
                rgba(27, 31, 29, 0.52);

            border:
                1px solid
                rgba(175, 183, 165, 0.22);

            border-radius: 50%;

            box-shadow:
                inset 0 0 22px
                rgba(0, 0, 0, 0.08);

            backdrop-filter:
                blur(11px)
                saturate(90%);

            -webkit-backdrop-filter:
                blur(11px)
                saturate(90%);
        }

        .clock-face::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at 34% 26%,
                    rgba(255, 255, 255, 0.035),
                    transparent 45%
                );

            border-radius: 50%;
        }


        /* =====================================================
           MINUTE AND HOUR MARKERS
           ===================================================== */

        .clock-marker {
            position: absolute;

            top: 7px;
            left: 50%;

            width: 1px;
            height: 5px;

            background:
                rgba(204, 207, 198, 0.25);

            transform-origin:
                50%
                88px;
        }

        .clock-marker-major {
            width: 2px;
            height: 9px;

            background:
                rgba(174, 182, 160, 0.66);
        }


        /* =====================================================
           CLOCK HANDS
           ===================================================== */

        .clock-hand {
            position: absolute;

            left: 50%;
            bottom: 50%;

            border-radius: 999px;

            transform-origin:
                50%
                100%;
        }

        .clock-hour-hand {
            z-index: 3;

            width: 4px;
            height: 45px;

            background:
                rgba(220, 219, 210, 0.90);
        }

        .clock-minute-hand {
            z-index: 4;

            width: 3px;
            height: 65px;

            background:
                rgba(165, 173, 155, 0.90);
        }

        .clock-second-hand {
            z-index: 5;

            width: 1px;
            height: 72px;

            background:
                rgba(139, 147, 131, 0.75);
        }


        /* =====================================================
           CENTRE PIN
           ===================================================== */

        .clock-centre {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 6;

            width: 10px;
            height: 10px;

            background:
                rgba(210, 211, 194, 0.94);

            border:
                2px solid
                rgba(90, 96, 86, 0.94);

            border-radius: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );
        }


        /* =====================================================
           SMALLER EMBEDS
           ===================================================== */

        @media (max-width: 190px) {

            .clock-face {
                width: 170px;
                height: 170px;
            }

            .clock-marker {
                transform-origin:
                    50%
                    78px;
            }

            .clock-hour-hand {
                height: 40px;
            }

            .clock-minute-hand {
                height: 57px;
            }

            .clock-second-hand {
                height: 64px;
            }

        }


        @media (prefers-reduced-motion: reduce) {

            .clock-second-hand {
                display: none;
            }

        }

    </style>

</head>


<body>

    <main
        class="clock-face"
        id="clockFace"
        aria-label="Current local time"
    >

        <div
            class="clock-hand clock-hour-hand"
            id="hourHand"
        ></div>

        <div
            class="clock-hand clock-minute-hand"
            id="minuteHand"
        ></div>

        <div
            class="clock-hand clock-second-hand"
            id="secondHand"
        ></div>

        <div class="clock-centre"></div>

    </main>


    <script>

        "use strict";


        function createClockMarkers() {

            const clockFace =
                document.getElementById(
                    "clockFace"
                );


            for (
                let markerNumber = 0;
                markerNumber < 60;
                markerNumber++
            ) {

                const marker =
                    document.createElement(
                        "span"
                    );


                marker.className =
                    "clock-marker";


                if (
                    markerNumber % 5 === 0
                ) {

                    marker.classList.add(
                        "clock-marker-major"
                    );

                }


                marker.style.transform =
                    "translateX(-50%) rotate(" +
                    markerNumber * 6 +
                    "deg)";


                clockFace.appendChild(
                    marker
                );

            }

        }


        function updateClock() {

            const now =
                new Date();


            const hours =
                now.getHours();


            const minutes =
                now.getMinutes();


            const seconds =
                now.getSeconds();


            const milliseconds =
                now.getMilliseconds();


            const smoothSeconds =
                seconds +
                milliseconds / 1000;


            const smoothMinutes =
                minutes +
                smoothSeconds / 60;


            const smoothHours =
                hours % 12 +
                smoothMinutes / 60;


            document.getElementById(
                "hourHand"
            ).style.transform =
                "translateX(-50%) rotate(" +
                smoothHours * 30 +
                "deg)";


            document.getElementById(
                "minuteHand"
            ).style.transform =
                "translateX(-50%) rotate(" +
                smoothMinutes * 6 +
                "deg)";


            document.getElementById(
                "secondHand"
            ).style.transform =
                "translateX(-50%) rotate(" +
                smoothSeconds * 6 +
                "deg)";


            document.getElementById(
                "clockFace"
            ).setAttribute(
                "aria-label",
                "Current local time: " +
                now.toLocaleTimeString(
                    "en-GB",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                )
            );


            window.requestAnimationFrame(
                updateClock
            );

        }


        createClockMarkers();

        updateClock();

    </script>

</body>

</html>
